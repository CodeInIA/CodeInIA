<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320" role="img" aria-label="Sergio Barrios Paz, Computer Engineer">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0a0f1e"/><stop offset="1" stop-color="#111a33"/>
    </linearGradient>
    <linearGradient id="ac" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#22d3ee"/><stop offset=".5" stop-color="#818cf8"/><stop offset="1" stop-color="#43e3a0"/>
    </linearGradient>
    <radialGradient id="g1" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#22d3ee" stop-opacity=".35"/><stop offset="1" stop-color="#22d3ee" stop-opacity="0"/></radialGradient>
    <radialGradient id="g2" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#8b5cf6" stop-opacity=".30"/><stop offset="1" stop-color="#8b5cf6" stop-opacity="0"/></radialGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#ffffff" stroke-opacity=".035"/>
    </pattern>
    <clipPath id="clip"><rect width="1200" height="320" rx="18"/></clipPath>
    <style>
      .float1 { animation: f1 9s ease-in-out infinite; }
      .float2 { animation: f2 11s ease-in-out infinite; }
      .blink { animation: blink 1.1s steps(1) infinite; }
      .tw { animation: tw 3s ease-in-out infinite; }
      .tw:nth-child(2n) { animation-delay: 1.2s; }
      .tw:nth-child(3n) { animation-delay: 2.1s; }
      @keyframes f1 { 0%,100% { transform: translate(0,0) } 50% { transform: translate(40px,18px) } }
      @keyframes f2 { 0%,100% { transform: translate(0,0) } 50% { transform: translate(-50px,-14px) } }
      @keyframes blink { 0%,50% { opacity: 1 } 51%,100% { opacity: 0 } }
      @keyframes tw { 0%,100% { opacity: .15 } 50% { opacity: .9 } }
    </style>
  </defs>
  <g clip-path="url(#clip)">
    <rect width="1200" height="320" fill="url(#bg)"/>
    <rect width="1200" height="320" fill="url(#grid)"/>
    <circle class="float1" cx="980" cy="70" r="260" fill="url(#g1)"/>
    <circle class="float2" cx="180" cy="300" r="240" fill="url(#g2)"/>
    <g fill="#cfe9ff">
      <circle class="tw" cx="1040" cy="210" r="1.6"/><circle class="tw" cx="1110" cy="120" r="1.2"/>
      <circle class="tw" cx="900" cy="250" r="1.4"/><circle class="tw" cx="760" cy="60" r="1.1"/>
      <circle class="tw" cx="1150" cy="270" r="1.5"/><circle class="tw" cx="640" cy="280" r="1.2"/>
      <circle class="tw" cx="980" cy="40" r="1.3"/><circle class="tw" cx="830" cy="160" r="1"/>
    </g>
    <!-- code glyph -->
    <g transform="translate(930 112)" fill="none" stroke="url(#ac)" stroke-width="10" stroke-linecap="round" stroke-linejoin="round" opacity=".9">
      <path d="M40 0 L0 48 L40 96"/><path d="M160 0 L200 48 L160 96"/><path d="M120 -10 L80 106"/>
    </g>
    <text x="72" y="104" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace" font-size="18" fill="#22d3ee" letter-spacing="2">$ whoami<tspan class="blink" fill="#22d3ee"> ▍</tspan></text>
    <text x="70" y="172" font-family="'Segoe UI', Ubuntu, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="62" font-weight="700" fill="#e6edf3">Sergio Barrios Paz</text>
    <rect x="72" y="194" width="120" height="4" rx="2" fill="url(#ac)"/>
    <text x="72" y="238" font-family="'Segoe UI', Ubuntu, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="24" font-weight="600" fill="#e6edf3">Computer Engineer <tspan fill="#5b6880">·</tspan> <tspan fill="#9aa7bd" font-weight="400">Universidad Rey Juan Carlos</tspan></text>
    <text x="72" y="274" font-family="'Segoe UI', Ubuntu, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="18" fill="#9aa7bd">Full-stack · Zero-knowledge &amp; blockchain · Rust desktop apps · Madrid, Spain</text>
  </g>
  <rect x=".5" y=".5" width="1199" height="319" rx="18" fill="none" stroke="#ffffff" stroke-opacity=".08"/>
</svg>
