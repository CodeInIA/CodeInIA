<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="440" height="236" viewBox="0 0 440 236" role="img" aria-label="Space Atlas">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#111a33"/><stop offset="1" stop-color="#0a0f1e"/></linearGradient>
    <linearGradient id="bd" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#fbbf24"/><stop offset="1" stop-color="#f97316" stop-opacity=".25"/></linearGradient>
    <radialGradient id="gl" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#fbbf24" stop-opacity=".28"/><stop offset="1" stop-color="#fbbf24" stop-opacity="0"/></radialGradient>
    <clipPath id="c"><rect width="440" height="236" rx="16"/></clipPath>
    <style>.p { animation: p 6s ease-in-out infinite; transform-origin: 380px 56px; } @keyframes p { 0%,100% { opacity:.7; transform: scale(1) } 50% { opacity:1; transform: scale(1.12) } }</style>
  </defs>
  <g clip-path="url(#c)">
    <rect width="440" height="236" fill="url(#bg)"/>
    <circle class="p" cx="380" cy="56" r="120" fill="url(#gl)"/>
    <g transform="translate(378 58)">
      <circle r="28" fill="#f59e0b" fill-opacity=".9"/><circle r="28" fill="none" stroke="#fde68a" stroke-opacity=".5" stroke-width="2"/>
      <circle cx="-9" cy="-6" r="5" fill="#b45309" fill-opacity=".6"/><circle cx="8" cy="9" r="3.5" fill="#b45309" fill-opacity=".5"/>
      <ellipse rx="46" ry="12" fill="none" stroke="#fde68a" stroke-width="3" transform="rotate(-18)"/>
    </g>
    <rect x="24" y="22" width="236" height="22" rx="6" fill="#fbbf24" fill-opacity=".16"/>
    <text x="35" y="37" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace" font-size="11" font-weight="700" fill="#fbbf24" letter-spacing=".6">WINNER · NASA SPACE APPS MADRID</text>
    <text x="24" y="80" font-family="'Segoe UI', Ubuntu, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="25" font-weight="700" fill="#e6edf3">Space Atlas</text>
    <text x="24" y="108" font-family="'Segoe UI', Ubuntu, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13.5" fill="#9aa7bd"><tspan x="24" dy="0">3D solar-system explorer with deep-zoom Mars imagery</tspan><tspan x="24" dy="19">and AI geological insights. Local winner and Global</tspan><tspan x="24" dy="19">Nominee, NASA Space Apps 2025.</tspan></text>
    <rect x="24" y="168" width="52" height="22" rx="11" fill="#fbbf24" fill-opacity=".12" stroke="#fbbf24" stroke-opacity=".35"/><text x="50" y="183" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace" font-size="11" fill="#fbbf24">React</text><rect x="82.5" y="168" width="72" height="22" rx="11" fill="#fbbf24" fill-opacity=".12" stroke="#fbbf24" stroke-opacity=".35"/><text x="118" y="183" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace" font-size="11" fill="#fbbf24">Three.js</text><rect x="161.1" y="168" width="65" height="22" rx="11" fill="#fbbf24" fill-opacity=".12" stroke="#fbbf24" stroke-opacity=".35"/><text x="194" y="183" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace" font-size="11" fill="#fbbf24">Node.js</text><rect x="233.0" y="168" width="98" height="22" rx="11" fill="#fbbf24" fill-opacity=".12" stroke="#fbbf24" stroke-opacity=".35"/><text x="282" y="183" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace" font-size="11" fill="#fbbf24">Azure OpenAI</text><rect x="338.4" y="168" width="65" height="22" rx="11" fill="#fbbf24" fill-opacity=".12" stroke="#fbbf24" stroke-opacity=".35"/><text x="371" y="183" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace" font-size="11" fill="#fbbf24">MongoDB</text>
    <text x="24" y="216" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace" font-size="11.5" fill="#5b6880">NASA Space Apps Challenge 2025</text>
  </g>
  <rect x="1" y="1" width="438" height="234" rx="15" fill="none" stroke="url(#bd)" stroke-width="1.5"/>
